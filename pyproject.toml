[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-ai-agent"
version = "1.0.0"
description = "Autonomous Institutional Equity Research AI Agent powered by PyKX/KDB-X, exchange XBRL filings, strict actual-data guards, and SEBI-compliant educational reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "yfinance>=0.2.50",
  "pykx>=2.5.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "pymupdf>=1.24.0",
  "openpyxl>=3.1.2",
  "openai>=1.30.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.scripts]
equity-agent = "cli:cli"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
