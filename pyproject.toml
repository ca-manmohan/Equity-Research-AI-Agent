[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-ai-agent"
version = "1.0.0"
description = "Equity Research AI Agent for fundamental analysis, Indian stock analysis, Nifty 50 screening, and step-by-step stock research powered by PyKX/KDB-X, NSE XBRL filings, FCFF DCF, strict actual-data guards & SEBI educational reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "fundamental-analysis",
  "equity-research",
  "indian-stock-analysis",
  "nifty-50",
  "how-to-do-stock-research",
  "dcf-valuation",
  "kdb-x",
  "pykx",
  "mcp-server",
  "ai-agent",
  "nse-india",
  "sebi-compliant"
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "yfinance>=0.2.50",
  "pykx>=2.5.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "pymupdf>=1.24.0",
  "openpyxl>=3.1.2",
  "openai>=1.30.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.scripts]
equity-agent = "cli:cli"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
